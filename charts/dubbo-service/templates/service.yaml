apiVersion: v1
kind: Service
metadata:
  name: {{ include "dubbo-service.fullname" . }}
  labels:
    {{- include "dubbo-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.dubboPort }}
      targetPort: dubbo
      protocol: TCP
      name: dubbo
  selector:
    {{- include "dubbo-service.selectorLabels" . | nindent 4 }}
